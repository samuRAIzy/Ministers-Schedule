<style>
:root{--ink:#18243b;--muted:#637187;--accent:#7040cb;--soft:#f2ebff;--line:#e3e8f0}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(at top left,#fce7f3,transparent 45%),#f4f7fd;font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{padding:25px max(18px,calc((100vw - 1180px)/2));background:linear-gradient(110deg,#723acb,#2563eb 60%,#0891b2);color:white;border-bottom:5px solid #fbbf24}h1{font-size:27px;margin:0 0 5px}header p{margin:0;color:#eee9ff}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;font-weight:750;padding:11px 16px;background:var(--accent);color:#fff}button:disabled{opacity:.55;cursor:wait}.secondary{background:#e9eef6;color:#34445e}.outline{background:white;color:var(--accent);border:1px solid #d8ccef}.danger{background:#fff1f2;color:#9f1239}.toolbar{max-width:1180px;margin:18px auto 12px;padding:0 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar label{font-weight:750}.toolbar input{width:185px}.spacer{flex:1}.status{max-width:1180px;margin:0 auto;padding:0 18px 14px;color:var(--muted);font-size:13px}.status.error{color:#991b1b}nav{max-width:1180px;margin:auto;padding:0 18px;display:flex;gap:7px;overflow:auto;scrollbar-width:thin;padding-bottom:12px}nav button{white-space:nowrap;background:var(--navsoft,#ede9fe);color:var(--navink,#5b21b6);border:2px solid transparent}nav button.active{background:var(--navink,#5b21b6);color:white}main{max-width:1180px;margin:0 auto;padding:6px 18px 100px}h2{font-size:22px;margin:8px 0}h3{margin:0;font-size:18px}.hint{font-size:13px;color:var(--muted);line-height:1.5}.panel{background:white;border-radius:18px;border:1px solid var(--line);box-shadow:0 8px 25px #31467b08;padding:18px;margin:13px 0}.heading{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.heading .spacer{min-width:20px}.badge{border-radius:999px;padding:5px 10px;font-size:12px;font-weight:750;background:var(--soft);color:var(--accent)}input,textarea{padding:10px 12px;border:1px solid #cad4e4;border-radius:10px;background:#fff;width:100%;color:var(--ink)}input:focus,textarea:focus{outline:3px solid #c4b5fd66;border-color:#8b5cf6}label.field{display:block;font-size:13px;font-weight:750;margin-bottom:5px}.weeks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.week{border-top:5px solid var(--accent);margin:0;background:linear-gradient(150deg,var(--soft),white 34%)}.weekhead{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:15px}.day{border-radius:12px;background:var(--accent);color:#fff;text-align:center;padding:7px 10px;min-width:60px;font-size:12px}.day strong{display:block;font-size:22px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.group{grid-column:1/-1;padding:7px 10px;border-radius:8px;background:var(--soft);color:var(--accent);font-weight:800}.editorfoot{position:sticky;bottom:10px;z-index:5;margin-top:18px;padding:13px;background:#ffffffee;box-shadow:0 4px 24px #28344c20;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.savehint{flex:1;color:var(--muted);font-size:13px}.dashboard-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.ministry{border-top:5px solid var(--accent);margin:0;background:linear-gradient(145deg,var(--soft),white 38%)}.assignment{padding:11px 0;border-bottom:1px solid #e9edf4;display:grid;grid-template-columns:1fr 1.1fr;gap:10px}.assignment:last-child{border:0}.assignment dt{font-size:13px;font-weight:700;color:#475569}.assignment dd{margin:0;font-weight:750;white-space:pre-wrap;overflow-wrap:anywhere}.blank{color:#8a95a5!important;font-weight:400!important;font-size:13px}.datebar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.datebar input{width:190px}.empty{padding:28px;text-align:center;color:var(--muted);background:#fff;border:1px dashed #bdcbe0;border-radius:15px}.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px;font-size:13px}th,td{padding:10px;text-align:left;border-bottom:1px solid #e6ecf4;white-space:pre-wrap}th{background:var(--soft);color:var(--accent)}td:first-child{font-weight:700;min-width:135px}tbody tr:nth-child(even){background:#f8faff}.eventmeta{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:15px}.notice{border-radius:10px;padding:10px;background:#dcfce7;color:#166534;margin-top:12px}.hidden{display:none!important}summary{cursor:pointer;font-weight:750;padding:5px 0}.legend{display:flex;gap:7px;flex-wrap:wrap}.tab-caption{max-width:650px}.action-small{font-size:12px;padding:7px 10px}button:focus-visible{outline:3px solid #fbbf24;outline-offset:3px}@media(max-width:700px){h1{font-size:23px}.weeks,.dashboard-grid{grid-template-columns:1fr}.toolbar{gap:8px}header{padding:21px 18px}.fields{gap:12px}.editorfoot{bottom:5px}.savehint{min-width:160px}.eventmeta{grid-template-columns:1fr}.toolbar .spacer{display:none}main{padding:0 12px 90px}nav{padding-left:12px}.assignment{grid-template-columns:1fr 1fr}}

/* Left-side ministry navigation */
body{padding-left:250px}
nav{position:fixed;inset:0 auto 0 0;width:250px;max-width:none;margin:0;padding:22px 13px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;overflow-x:hidden;background:#fff;border-right:1px solid var(--line);box-shadow:3px 0 18px #28344c0a;z-index:30}

</style></head><body>
<header><button id="menuToggle" class="menu-toggle outline" aria-controls="tabs" aria-expanded="false">☰ Menu</button><h1>JIL Rotorua Assigned Ministers</h1><p>Plan the month. See who is serving.</p></header>
<div class="toolbar"><label for="month">Month &amp; year</label><input id="month" type="month" required><span class="spacer"></span><button id="syncNow">Sync Now</button><button class="secondary" id="refresh">Refresh Database</button></div>
<div id="status" class="status" role="status">Connecting to Google Sheets…</div><script>window.onerror=function(m,s,l){var e=document.getElementById('status');if(e){e.textContent='Page error: '+m+' (line '+l+')';e.className='status error'}};window.onunhandledrejection=function(x){var e=document.getElementById('status');if(e){e.textContent='Connection error: '+((x.reason&&x.reason.message)||x.reason||'Unknown error');e.className='status error'}}</script><button id="menuBackdrop" class="menu-backdrop" aria-label="Close ministry menu"></button><nav id="tabs" aria-label="Ministry schedules"></nav>
<main><section id="dashboard"><div class="panel datebar"><div><h2>Dashboard</h2><p class="hint" style="margin:3px 0">Select a date to see the latest saved assignments.</p></div><span class="spacer"></span><label for="selectedDate">Service / event date</label><input id="selectedDate" type="date"><button class="outline" id="today">Today</button></div><h2 id="dateHeading"></h2><div id="dateCards" class="dashboard-grid"></div><div class="panel"><details id="overview"><summary>View the full month — Sunday Services &amp; Prayer Meetings</summary><div id="monthTables"></div></details></div></section>
<section id="editor" class="hidden"><div class="heading"><div class="tab-caption"><h2 id="editorTitle"></h2><p id="editorHint" class="hint"></p></div><span class="spacer"></span><button id="addRole" class="outline">+ Add Role</button><button id="addEvent" class="outline hidden">+ Add Gathering</button></div><div id="weeks" class="weeks"></div><div class="editorfoot"><span id="saveHint" class="savehint">Save the month on this device, then tap Sync Now.</span><button id="saveMonth">Save Monthly Schedule</button><button id="showDashboard" class="secondary">View Dashboard</button></div></section></main><datalist id="names"></datalist>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbxn2IzK-_LN7qH-eH_n9VecKeCu49AOvEOorftWHivo0bchoVW1l5aEVxw131GX4Lhhvw/exec';
const MINISTRIES=[
 {id:'sunday',name:'Sunday Schedule Assignment',day:0,color:'#6d28d9',soft:'#f2eaff',roles:['Worship Leader','Opening Prayer','Word of God','Tithes and Offering','Announcements','Closing Prayer']},
 {id:'prayer',name:'Prayer Meeting',day:5,color:'#1d4ed8',soft:'#e8f1ff',roles:['Worship Leader','Opening Prayer','Facilitator','Word of God']},
 {id:'other',name:'Other Gatherings',color:'#b45309',soft:'#fff3d5',roles:['Worship Leader','Emcee','Guest Speaker']},
 {id:'wan',name:'WAN',day:0,color:'#be185d',soft:'#fce7f3',roles:['VIA · Worship Leader','VIA · Back ups','JAM · Keyboard','JAM · Guitar','JAM · Drums']},
 {id:'man',name:'MAN',day:0,color:'#0e7490',soft:'#dff7fc',roles:['Program Coordinator','Clicker','Technical','Photographer']},
 {id:'children',name:"Children's Network",day:0,color:'#db2777',soft:'#fce7f3',roles:['Main Teacher','Assistant Teachers']},
 {id:'icare',name:'Icare Ministry / Cook',day:0,color:'#16a34a',soft:'#ecfdf3',roles:['Cook','Dish']},
 {id:'gatekeepers',name:'Gatekeepers',day:0,color:'#c2410c',soft:'#fff0e5',roles:['Gatekeepers']},
 {id:'sos',name:'SOS',day:0,color:'#4338ca',soft:'#eeedff',roles:['SOS']}
];
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID(), clone=o=>JSON.parse(JSON.stringify(o));
function nzToday(){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Pacific/Auckland',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const p=Object.fromEntries(parts.map(x=>[x.type,x.value]));return p.year+'-'+p.month+'-'+p.day}
function dateLabel(s,long=false){return new Date(s+'T12:00:00').toLocaleDateString('en-NZ',{weekday:long?'long':'short',day:'numeric',month:'short',year:long?'numeric':undefined})}
function monthLabel(s){return new Date(s+'-01T12:00:00').toLocaleDateString('en-NZ',{month:'long',year:'numeric'})}
function datesForMonth(month,day){const [y,m]=month.split('-').map(Number),out=[];for(let d=1;d<=new Date(y,m,0).getDate();d++){const x=new Date(y,m-1,d,12);if(x.getDay()===day)out.push(month+'-'+String(d).padStart(2,'0'))}return out}
let db={plans:[],ministers:[],schedules:[],receipts:[]},active='dashboard',drafts={},pending={},busy=false,connected=false;
const draftKey=(month,id)=>month+'|'+id;
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
function cache(){try{localStorage.setItem('jilMonthlyCache',JSON.stringify(db))}catch(e){}}
function keepDrafts(){try{localStorage.setItem('jilMonthlyDrafts',JSON.stringify(drafts))}catch(e){}}
function keepPending(){try{localStorage.setItem('jilSchedulePending',JSON.stringify(pending))}catch(e){}}
function plan(month,id){return db.plans.find(x=>x.month===month&&x.ministry===id)}
function newEntries(month,id){const m=MINISTRIES.find(x=>x.id===id);if(id==='other')return[];return datesForMonth(month,m.day).map(date=>({id:date,date,title:'',roles:m.roles.map(label=>({label,names:''}))}))}
function legacyEntries(month,id){const legacyName=id==='sunday'?'Sunday Service':id==='prayer'?'Prayer Meeting':null;if(!legacyName)return newEntries(month,id);const entries=newEntries(month,id);for(const x of db.schedules||[]){const date=String(x.Date||'').match(/\d{4}-\d{2}-\d{2}/)?.[0];const e=entries.find(e=>e.date===date);if(e&&x.Gathering===legacyName&&x.Status!=='Cancelled'){let r=e.roles.find(r=>r.label===x.Role);if(!r){r={label:x.Role,names:''};e.roles.push(r)}r.names=x.Minister||''}}return entries}
function getDraft(month,id){const key=draftKey(month,id);if(!drafts[key]){const p=plan(month,id);drafts[key]={version:p?.version||0,entries:clone(p?p.payload.entries:legacyEntries(month,id)),dirty:false}}return drafts[key]}
function savedEntries(month,id){const p=plan(month,id);return p?p.payload.entries:legacyEntries(month,id)}
function buildTabs(){$('tabs').innerHTML=[{id:'dashboard',name:'Dashboard',color:'#475569',soft:'#e9eef5'},...MINISTRIES].map(m=>`<button data-tab="${m.id}" style="--navink:${m.color};--navsoft:${m.soft}" class="${m.id===active?'active':''}">${esc(m.name)}</button>`).join('')}
function names(){const items=new Map();for(const r of db.ministers||[]){if(r.Active!=='No'&&r.Name)items.set(r.Name.toLowerCase(),r.Name)}for(const p of db.plans||[])for(const e of p.payload.entries)for(const r of e.roles)for(const n of r.names.split(/[;,\n]/).map(n=>n.trim()).filter(Boolean))items.set(n.toLowerCase(),n);$('names').innerHTML=[...items.values()].sort().map(n=>`<option value="${esc(n)}"></option>`).join('')}
function render(){buildTabs();names();$('dashboard').classList.toggle('hidden',active!=='dashboard');$('editor').classList.toggle('hidden',active==='dashboard');if(active==='dashboard')renderDashboard();else renderEditor()}
function switchTab(id){if(busy)return;active=id;render()}
function fieldHtml(role,eIndex,rIndex){const dish=role.label==='Dish';return `<div><label class="field" for="e${eIndex}r${rIndex}">${esc(role.label.split(' · ').pop())}</label><input id="e${eIndex}r${rIndex}" data-entry="${eIndex}" data-role="${rIndex}" ${dish?'':'list="names"'} value="${esc(role.names)}" placeholder="${dish?'Type the dish / food':'Type minister / team names'}" maxlength="1000"></div>`}
function renderEditor(){const m=MINISTRIES.find(x=>x.id===active),draft=getDraft($('month').value,active);$('editor').style.setProperty('--accent',m.color);$('editor').style.setProperty('--soft',m.soft);$('editorTitle').textContent=monthLabel($('month').value)+' — '+m.name;$('editorHint').textContent=active==='other'?'Add each gathering, choose its date, and fill in the roles. You can add custom roles to each gathering.':'All '+(m.day===5?'Fridays':'Sundays')+' are ready. Enter names for each week; use commas or semicolons for teams and backups.';$('addEvent').classList.toggle('hidden',active!=='other');$('addRole').classList.toggle('hidden',active==='other');$('saveHint').textContent=draft.dirty?'Unsaved changes — save this month when ready.':draft.version?'Saved month loaded. Change any name and save again.':'Fill in the weeks, then save the entire month once.';
 $('weeks').innerHTML=draft.entries.length?draft.entries.map((e,i)=>{let group='';const fields=e.roles.map((r,j)=>{const g=r.label.includes(' · ')?r.label.split(' · ')[0]:'';let h='';if(g&&g!==group){h=`<div class="group">${esc(g)}</div>`;group=g}return h+fieldHtml(r,i,j)}).join('');return `<article class="panel week"><div class="weekhead"><div><span class="badge">${active==='other'?'Gathering '+(i+1):'Week '+(i+1)}</span><h3 style="margin-top:7px">${esc(dateLabel(e.date))}</h3></div><div class="day">${new Date(e.date+'T12:00').toLocaleDateString('en-NZ',{month:'short'})}<strong>${e.date.slice(8)}</strong></div></div>${active==='other'?`<div class="eventmeta"><div><label class="field">Gathering / event name</label><input data-entry="${i}" data-meta="title" value="${esc(e.title)}" placeholder="e.g. Anniversary" maxlength="150" required></div><div><label class="field">Date</label><input type="date" data-entry="${i}" data-meta="date" min="${$('month').value}-01" max="${lastDay($('month').value)}" value="${e.date}" required></div></div>`:''}<div class="fields">${fields}</div>${active==='other'?`<div class="heading" style="margin-top:14px"><button class="outline action-small" data-event-role="${i}">+ Add Role</button><span class="spacer"></span><button class="danger action-small" data-remove-event="${i}">Remove Gathering</button></div>`:''}</article>`}).join(''):'<div class="empty">No gatherings added yet. Tap + Add Gathering.</div>';
}
function lastDay(month){const [y,m]=month.split('-').map(Number);return month+'-'+new Date(y,m,0).getDate()}
function markDirty(){const d=getDraft($('month').value,active);d.dirty=true;keepDrafts();$('saveHint').textContent='Unsaved changes — save this month when ready.'}
function renderDashboard(){const date=$('selectedDate').value,month=date.slice(0,7);$('dateHeading').textContent=dateLabel(date,true);let cards='';for(const m of MINISTRIES){const entries=savedEntries(month,m.id).filter(e=>e.date===date);for(const e of entries){cards+=`<article class="panel ministry" style="--accent:${m.color};--soft:${m.soft}"><div class="heading"><h3>${esc(m.id==='other'?e.title:m.name)}</h3><span class="spacer"></span><button class="outline action-small" data-edit="${m.id}">Edit Schedule</button></div><dl>${e.roles.map(r=>`<div class="assignment"><dt>${esc(r.label)}</dt><dd class="${r.names?'':'blank'}">${esc(r.names||'Not yet assigned')}</dd></div>`).join('')}</dl></article>`}}$('dateCards').innerHTML=cards||'<div class="empty">No gatherings scheduled on this date. Choose a Sunday, Friday, or add an Other Gathering.</div>';$('monthTables').innerHTML=['sunday','prayer'].map(id=>monthlyTable(id,$('month').value)).join('')}
function monthlyTable(id,month){const m=MINISTRIES.find(x=>x.id===id),entries=savedEntries(month,id),roles=[...new Set(entries.flatMap(e=>e.roles.map(r=>r.label)))];return `<div style="--accent:${m.color};--soft:${m.soft};margin-top:20px"><div class="heading"><h3>${esc(m.name)}</h3><span class="spacer"></span><button class="outline action-small" data-edit="${id}">Edit Month</button></div><div class="table-scroll"><table><thead><tr><th>Role</th>${entries.map((e,i)=>`<th>Week ${i+1}<br>${esc(dateLabel(e.date))}</th>`).join('')}</tr></thead><tbody>${roles.map(role=>`<tr><td>${esc(role)}</td>${entries.map(e=>`<td>${esc(e.roles.find(r=>r.label===role)?.names||'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}
function apiRead(){return new Promise((resolve,reject)=>{const callback='jilScheduleCallback_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script'),timer=setTimeout(()=>finish(new Error('The database did not respond.')),15000);function finish(error,data){clearTimeout(timer);delete window[callback];script.remove();error?reject(error):resolve(data)}window[callback]=data=>finish(null,data);script.onerror=()=>finish(new Error('Could not connect to the schedule database.'));script.src=API_URL+'?callback='+encodeURIComponent(callback)+'&t='+Date.now();document.head.appendChild(script)})}
async function readDB(){const data=await apiRead();if(!data.ok)throw Error(data.error||'Database failed.');if(data.monthlyVersion!==1)throw Error('Update the separate Ministers Schedule Code.gs and deploy a new version first.');return data}
function applyDB(data){const remote=clone(data),map={};(remote.plans||[]).forEach(p=>map[p.key]=p);Object.keys(pending).forEach(key=>{const p=pending[key];map[key]={key:key,month:p.month,ministry:p.ministry,version:Number(map[key]?.version||0),payload:{entries:clone(p.entries)},updatedAt:'Waiting to sync'}});remote.plans=Object.values(map);db=remote;cache();connected=true;for(const key of Object.keys(drafts))if(!drafts[key].dirty)delete drafts[key];const count=Object.keys(pending).length;status('Connected to Google Sheets • '+new Date().toLocaleTimeString('en-NZ')+(count?' • '+count+' saved change'+(count===1?'':'s')+' waiting to sync':' • Everything synced'));render()}
async function refresh(){if(busy)return;try{status('Refreshing Google Sheets…');applyDB(await readDB())}catch(e){connected=false;status(e.message+' Showing saved device data, if available.',true);render()}}
function validateDraft(draft){for(const e of draft.entries){if(!e.date.startsWith($('month').value+'-'))throw Error('All gathering dates must be in the selected month.');if(active==='other'&&!e.title.trim())throw Error('Enter a gathering name for every event.')}}
async function save(){if(busy)return;const month=$('month').value,id=active,key=draftKey(month,id),draft=getDraft(month,id);try{validateDraft(draft)}catch(e){status(e.message,true);return}const snapshot={month:month,ministry:id,entries:clone(draft.entries)};const old=(db.plans||[]).find(p=>p.key===key),local={key:key,month:month,ministry:id,version:Number(old?.version||0),payload:{entries:clone(snapshot.entries)},updatedAt:'Saved on this device'};db.plans=(db.plans||[]).filter(p=>p.key!==key).concat(local);pending[key]=snapshot;delete drafts[key];keepDrafts();keepPending();cache();active='dashboard';if(snapshot.entries.length)$('selectedDate').value=snapshot.entries[0].date;render();status('Saved on this device • Tap Sync Now to send it to Google Sheets.')}
async function syncNow(){if(busy)return;const keys=Object.keys(pending);if(!keys.length){status('Everything is already synced with Google Sheets.');return}busy=true;document.querySelectorAll('button,input').forEach(b=>b.disabled=true);try{let latest=await readDB();for(let n=0;n<keys.length;n++){const key=keys[n],saved=pending[key],remote=(latest.plans||[]).find(p=>p.key===key);const data={month:saved.month,ministry:saved.ministry,version:Number(remote?.version||0),entries:clone(saved.entries)},requestId=uid();status('Syncing schedule '+(n+1)+' of '+keys.length+'…');await fetch(API_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'saveMonth',requestId:requestId,data:data})});let confirmed=null;for(let i=0;i<12;i++){await new Promise(r=>setTimeout(r,1000));const check=await readDB(),receipt=(check.receipts||[]).find(r=>r.requestId===requestId);if(receipt){if(!receipt.ok)throw Error(receipt.message||'Sync failed.');confirmed=check;break}}if(!confirmed)throw Error('Sync was sent but could not yet be confirmed.');delete pending[key];keepPending();latest=confirmed}applyDB(latest);status('Sync complete • Google Sheets is up to date.')}catch(e){keepPending();status(e.message+' Your schedules remain safely saved on this device; tap Sync Now again.',true)}finally{busy=false;document.querySelectorAll('button,input').forEach(b=>b.disabled=false)}}
function addRole(index){const label=prompt('Role name (e.g. Usher or Communion):');if(!label||!label.trim())return;const d=getDraft($('month').value,active),targets=index===undefined?d.entries:[d.entries[index]];if(targets.some(e=>e.roles.some(r=>r.label.toLowerCase()===label.trim().toLowerCase()))){status('This role already exists.',true);return}targets.forEach(e=>e.roles.push({label:label.trim(),names:''}));markDirty();renderEditor()}
function addEvent(){const d=getDraft($('month').value,'other');d.entries.push({id:uid(),date:$('month').value+'-01',title:'',roles:MINISTRIES.find(m=>m.id==='other').roles.map(label=>({label,names:''}))});markDirty();renderEditor()}
function editSaved(id){const month=$('selectedDate').value.slice(0,7);if(month!==$('month').value)$('month').value=month;const key=draftKey(month,id);if(drafts[key]?.dirty){if(!confirm('You have an unsaved draft. Replace it with the latest saved month? Cancel keeps the draft.')){switchTab(id);return}delete drafts[key];keepDrafts()}switchTab(id)}
// Initialization is isolated so the calendar and display logic can be tested.
function closeMenu(){document.body.classList.remove('menu-open');$('menuToggle').setAttribute('aria-expanded','false')}
function init(){$('menuToggle').onclick=()=>{const open=document.body.classList.toggle('menu-open');$('menuToggle').setAttribute('aria-expanded',String(open))};$('menuBackdrop').onclick=closeMenu;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});const today=nzToday();$('month').value=today.slice(0,7);$('selectedDate').value=today;try{db=JSON.parse(localStorage.getItem('jilMonthlyCache'))||db;drafts=JSON.parse(localStorage.getItem('jilMonthlyDrafts'))||{};pending=JSON.parse(localStorage.getItem('jilSchedulePending'))||{}}catch(e){}$('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){switchTab(b.dataset.tab);closeMenu()}};$('month').onchange=()=>{if(!$('month').value)return;$('selectedDate').value=datesForMonth($('month').value,0)[0];render()};$('selectedDate').onchange=()=>{if(!$('selectedDate').value)return;$('month').value=$('selectedDate').value.slice(0,7);renderDashboard()};$('today').onclick=()=>{$('selectedDate').value=nzToday();$('month').value=nzToday().slice(0,7);renderDashboard()};$('syncNow').onclick=syncNow;$('refresh').onclick=refresh;$('saveMonth').onclick=save;$('showDashboard').onclick=()=>switchTab('dashboard');$('addRole').onclick=()=>addRole();$('addEvent').onclick=addEvent;$('weeks').oninput=e=>{const i=e.target.dataset.entry;if(i===undefined)return;const d=getDraft($('month').value,active),r=e.target.dataset.role;if(r!==undefined)d.entries[i].roles[r].names=e.target.value;else if(e.target.dataset.meta)d.entries[i][e.target.dataset.meta]=e.target.value;markDirty()};document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.edit)editSaved(b.dataset.edit);if(b.dataset.eventRole!==undefined)addRole(Number(b.dataset.eventRole));if(b.dataset.removeEvent!==undefined&&confirm('Remove this gathering from the month? It is removed from Google Sheets only after saving.')){getDraft($('month').value,'other').entries.splice(Number(b.dataset.removeEvent),1);markDirty();renderEditor()}});window.addEventListener('beforeunload',e=>{if(Object.values(drafts).some(d=>d.dirty)){e.preventDefault();e.returnValue=''}});render();refresh()}
init();
</script></body></html>
